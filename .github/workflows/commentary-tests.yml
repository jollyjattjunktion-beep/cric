name: Commentary regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  commentary-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile server.py final.py human_commentator.py cricket_streamer.py
      - name: Run commentary regression tests
        run: python -m unittest -v test_finalpy_adapter test_hinglish_commentary test_server_over_completion
